name: Render and publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for the PDF download)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fallback only: the book ships a committed _freeze/ cache, so these
      # deps are used only if Quarto decides a chapter must be re-executed.
      - name: Install book Python dependencies
        run: pip install -r quarto-book/requirements.txt

      # Course website (root project) -> _site. Best-effort: a scaffold
      # problem here must not block publishing the book.
      - name: Render course website
        continue-on-error: true
        run: quarto render

      # The atlas book (nested project) -> quarto-book/_book, HTML + PDF.
      # Uses the committed freeze cache, so this does not re-run Python;
      # TinyTeX compiles the PDF that the HTML "Download" link points to.
      - name: Render book (HTML + PDF)
        run: quarto render quarto-book

      - name: Assemble site (book under /quarto-book/)
        run: |
          mkdir -p _site/quarto-book
          cp -R quarto-book/_book/. _site/quarto-book/
          # If the course site failed to render, redirect the root to the book.
          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=quarto-book/">' > _site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
